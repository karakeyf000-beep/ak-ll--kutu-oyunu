function sesliOku(metin, bittigindeYap = null) {

    // Eğer önceki konuşma varsa durdur
    window.speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(metin);

    utterance.lang = "tr-TR"; // Türkçe okuma
    utterance.rate = 1;       // hız (0.8 yavaş, 1 normal, 1.2 hızlı)
    utterance.pitch = 1;      // ses tonu

    if (bittigindeYap) {
        utterance.onend = bittigindeYap;
    }

    window.speechSynthesis.speak(utterance);
}

function kareleriOlustur() {
    const alan = document.getElementById('oyunAlani');

    if (!alan) {
        console.error("oyunAlani bulunamadı!");
        return;
    }

    alan.innerHTML = "";

    for (let i = 1; i <= 40; i++) {
        let b = document.createElement('div');
        b.className = 'kare';
        b.innerText = i;

        b.onclick = () => panelAc(i);

        alan.appendChild(b);
    }

    console.log("Kareler oluşturuldu");
}
function beepsesi() {
    beepSesi.currentTime = 0;
    beepSesi.play();
} 
function panelAc(no) {
    tumSesleriDurdur();
    const o = oyuncular[sira];
    
    const yasSira = ["4-5", "6-8", "9-11", "12-15", "yetiskin"];
    
    // Masadaki en küçük ve en büyük yaşları tespit et
    let enKucukYas = "yetiskin";
    let enBuyukYas = "4-5";
    oyuncular.forEach(p => {
        let pIndex = yasSira.indexOf(p.yas);
        let currentMinIndex = yasSira.indexOf(enKucukYas);
        let currentMaxIndex = yasSira.indexOf(enBuyukYas);
        if(pIndex !== -1 && pIndex < currentMinIndex) enKucukYas = p.yas;
        if(pIndex !== -1 && pIndex > currentMaxIndex) enBuyukYas = p.yas;
    });

    // --- YENİ MANTIK: REHBER MODU TESPİTİ ---
    let enBuyukSayisi = oyuncular.filter(p => p.yas === enBuyukYas).length;
    let rehberModuAktif = (o.yas === enBuyukYas && enBuyukSayisi === 1 && enBuyukYas !== enKucukYas);
    
    let ySayisi = oyuncular.filter(p => p.yas === 'yetiskin').length;
    let aktifYas = (o.yas === 'yetiskin' && ySayisi < 2) ? "tek_yetiskin" : o.yas;

    // 2. ÖZEL MOD KONTROLLERİ (Eşli Oyun vb.)
    if (o.yas === 'esli_oyun') {
        const paketDurumu = localStorage.getItem('esliPaketAktif');
        if (paketDurumu !== 'true') {
            document.getElementById('satisEkran').style.display = 'flex';
            return;
        }
    }

    // 3. BANKA KONTROLÜ
    if (!banka[aktifYas] || !banka[aktifYas][no]) {
        console.error("Görev bulunamadı! Aktif Yas:", aktifYas, "No:", no);
        return;
    }

    aktifVeri = JSON.parse(JSON.stringify(banka[aktifYas][no]));
    aktifVeri.kareNo = no;
    mevcutKelimeler = [];
    mevcutKelimeIndeksi = 0;

    if (!aktifVeri.k) { mevcutKelimeler.push({ k: "", e: "" }); }

    // 4. KELİME HAVUZU MANTIĞI
    if(aktifVeri.k) {
        let ek = "";
        let anaAdet = 2; 

        if(aktifVeri.k === "sessiz") ek = "sessiz_";
        else if(aktifVeri.k === true ) ek = "";
        else if(aktifVeri.k === "ciz") ek = "ciz_";
        else if(aktifVeri.k === "kutudan_soyle") { ek = "kutudan_soyle_"; anaAdet = 1; }
        else if(aktifVeri.k === "kutudan_bul") { ek = "kutudan_bul_"; anaAdet = 1; }

        let buTurdeSecilenler = [];

        const akilliSecici = (yasGrubu, ekEtiketi) => {
            let takipAnahtari = "genelOyunTakibi"; 
            let havuzKey = ekEtiketi + yasGrubu;
            let tamHavuz = [...(havuzlar[havuzKey] || havuzlar[yasGrubu] || [])];
            
            if (!kullanilmisKelimeler[takipAnahtari]) kullanilmisKelimeler[takipAnahtari] = [];
            
            let kalanlar = tamHavuz.filter(k => 
                !kullanilmisKelimeler[takipAnahtari].includes(k) && 
                !buTurdeSecilenler.includes(k)
            );

            if (kalanlar.length === 0) {
                kullanilmisKelimeler[takipAnahtari] = kullanilmisKelimeler[takipAnahtari].filter(k => !tamHavuz.includes(k));
                kalanlar = tamHavuz.filter(k => !buTurdeSecilenler.includes(k));
            }

            let secilen = kalanlar[Math.floor(Math.random() * kalanlar.length)];
            
            if (secilen) {
                buTurdeSecilenler.push(secilen);
                kullanilmisKelimeler[takipAnahtari].push(secilen);
                localStorage.setItem('kayitliHafiza', JSON.stringify(kullanilmisKelimeler));
                
                // --- Eşli oyun (obje) ise metne çevir ---
                if (typeof secilen === 'object') {
                    return secilen.k + "\n\n🚫 YASAKLILAR:\n• " + secilen.yasakli.join("\n• ");
                }
            }
            return secilen;
        };

        // --- ANA KELİMELERİN SEÇİMİ ---
        if (rehberModuAktif) {
            let altYaslar = yasSira.filter(y => yasSira.indexOf(y) < yasSira.indexOf(o.yas) && oyuncular.some(p => p.yas === y));
            for(let i=0; i < anaAdet; i++) {
                let hGrup = altYaslar[i % altYaslar.length];
                let k = akilliSecici(hGrup, ek); 
                if(k) mevcutKelimeler.push({ k: k, e: "", k_yas: hGrup });
            }
        } else {
            for(let i=0; i < anaAdet; i++) {
                let hGrup = (aktifYas === "tek_yetiskin") ? enKucukYas : o.yas;
                let k = akilliSecici(hGrup, ek); 
                if(k) mevcutKelimeler.push({ k: k, e: "", k_yas: hGrup });
            }
        }

        // --- 2+1 SİSTEMİ (Yıldızlı Etiket - GÜNCELLENDİ) ---
        if(anaAdet > 1) {
            // Eşli oyun modundaysa 3. kelimeyi de 'esli_oyun' havuzundan çek, değilse enKüçükYas'tan çek
            let hedefHavuz = (o.yas === 'esli_oyun') ? 'esli_oyun' : enKucukYas;
            
            let sk = akilliSecici(hedefHavuz, ek);
            if(sk) {
                // Eşli oyunda yıldızın yanına (4-5 İÇİN) gibi yazılar yazmasın diye kontrol ekledik
                let etiketMetni = (o.yas === 'esli_oyun') ? "" : ((yasSira.indexOf(o.yas) > yasSira.indexOf(enKucukYas)) ? ` (${enKucukYas.toUpperCase()} İÇİN)` : "");
                mevcutKelimeler.push({ k: sk, e: etiketMetni, k_yas: hedefHavuz });
            }
        }
        
        mevcutKelimeler.sort(() => Math.random() - 0.5);
    }

    // 5. EKRANIN HAZIRLANMASI
    document.getElementById('maske').style.display = 'block';
    document.getElementById('modal').style.display = 'block';
    document.getElementById('mOyuncu').innerText = o.ad;
    document.getElementById('mOyuncu').style.color = o.renk;
    document.getElementById('mGorev').innerText = aktifVeri.m;
    
    resetPanel();
// 🔊 TÜM SORULAR İÇİN SES

        // --- GÖRSEL UYARI KISMI ---

        if(eskiUyari) eskiUyari.remove();

        let uyariDiv = document.createElement('div');
        uyariDiv.id = "teslimUyarisi";
        uyariDiv.style = "background:var(--primary); color:white; padding:15px; border-radius:15px; margin:15px 0; font-weight:bold; animation: pulse 1.5s infinite; border: 2px solid rgba(255,255,255,0.2); text-align:center;";
        uyariDiv.innerHTML = `📱 TELEFONU ${o.ad.toUpperCase()}'E VERİN!`;
        document.getElementById('mGorev').after(uyariDiv);

        // --- SESLİ AKIŞ ---
        window.speechSynthesis.cancel(); // Siri'yi sustur
// 🔥 HER SORUDA SES ÇALSIN
// 🔊 TÜM SORULAR İÇİN SES

}
}
function mp3Cal(dosyaAdi, bittigindeCalistir = null) {
    if (!dosyaAdi) {
        if (bittigindeCalistir) bittigindeCalistir();
        return;
    }

    // Önce eski sesi kesin öldür
    if (window.aktifMp3) {
        window.aktifMp3.pause();
        window.aktifMp3.currentTime = 0;
        window.aktifMp3.src = ""; // 🔥 KRİTİK
    }

    window.aktifMp3 = new Audio(`sesler/${dosyaAdi}.mp3`);

    if (bittigindeCalistir) {
        window.aktifMp3.onended = bittigindeCalistir;
    }

    window.aktifMp3.play().catch(err => {
        console.log("MP3 hatası:", err);
        if (bittigindeCalistir) bittigindeCalistir();
    });
}

function tumSesleriDurdur() {
    console.log("TÜM SESLER DURDURULDU");

    // 🔊 MP3 durdur
    if (window.aktifMp3) {
        window.aktifMp3.pause();
        window.aktifMp3.currentTime = 0;
        window.aktifMp3.src = "";
        window.aktifMp3 = null;
    }
 if (beepSesi) {
        beepSesi.pause();
        beepSesi.currentTime = 0;}
    // 🗣️ Speech durdur
    window.speechSynthesis.cancel();
}
function kelimeyiAc() {
    tumSesleriDurdur();
    document.getElementById('btnGor').style.display = 'none';
    document.getElementById('kelime-kutusu').style.display = 'flex';
    kelimeGuncelle();
    if(aktifVeri.s < 900) document.getElementById('btnBasla').style.display = 'flex';
    else document.getElementById('kararGrubu').style.display = 'flex';
}
function kelimeGuncelle() {
    const kKutusu = document.getElementById('kelime-kutusu');
    const o = oyuncular[sira];
    let veri = mevcutKelimeler[mevcutKelimeIndeksi];
    if(!veri) return;
    
    let kelime = veri.k || "";
    let etiket = veri.e || "";

    // --- RESİM İÇİN TEMİZLEME (Alt satırdaki yasaklıları resim ismine dahil etme) ---
    // Sadece ilk satırı (ana kelimeyi) alıp resim ismine çevirir
    let anaKelimeMetni = kelime.split("\n")[0]; 
    let temizKelime = anaKelimeMetni.toLowerCase().trim()
        .replace(/ğ/g,'g').replace(/ü/g,'u').replace(/ş/g,'s')
        .replace(/ı/g,'i').replace(/ö/g,'o').replace(/ç/g,'c')
        .replace(/\s+/g, '');
    
    // YILDIZ MANTIĞI
    let yildizliEtiket = etiket !== "" ? `⭐ ${etiket}` : "";

    // Bankadaki 'y' notunu gösteren kısım
    let notHtml = aktifVeri.y ? `
        <div style="background:rgba(245,158,11,0.15); color:#f59e0b; padding:12px; border-radius:15px; margin-top:15px; font-size:0.85rem; border:1px solid rgba(245,158,11,0.3); line-height:1.4;">
            <strong>📌 NOT:</strong> ${aktifVeri.y}
        </div>` : "";

    let yetiskinSayisi = oyuncular.filter(p => p.yas === 'yetiskin').length;
    let isTekYetiskin = (o.yas === 'yetiskin' && yetiskinSayisi < 2);
    let resimHtml = "";

    // --- RESİM MANTIĞI ---
    if (aktifVeri && aktifVeri.r && aktifVeri.r.trim() !== "") {
        const isim = aktifVeri.r.trim();
        resimHtml = `<div id="resimAlani"><img src="resimler/${isim}.jpeg" onerror="resimDene(this, '${isim}')"></div>`;
    } 

    else if (aktifVeri.k === "kutudan_bul") {
        resimHtml = `<div id="resimAlani"><img src="resimler/${anaKelimeMetni.trim()}.jpeg" onerror="resimDene(this, '${anaKelimeMetni.trim()}')"></div>`;
    }
    else if ((o.yas === '4-5' || o.yas === '6-8' || isTekYetiskin || (etiket !== "" && (veri.k_yas === '4-5' || veri.k_yas === '6-8'))) && 
             (aktifVeri.m.includes("BU NEDİR") || aktifVeri.m.includes("RESMİ") || aktifVeri.k === "kutudan_bul" || aktifVeri.k === "sessiz" || aktifVeri.k === "ciz" || aktifVeri.k === "kutudan_soyle" || aktifVeri.k === true)) {
        
        resimHtml = `<div id="resimAlani"><img src="resimler/${temizKelime}.jpeg" onerror="resimDene(this, '${temizKelime}')"></div>`;
    }

    // --- ARAYÜZ AYARLARI ---
    let asamaGosterim = (mevcutKelimeler.length > 1) ? `AŞAMA ${mevcutKelimeIndeksi+1} / ${mevcutKelimeler.length}` : "";
    let butonGosterim = (mevcutKelimeler.length > 1) ? "flex" : "none";

    // KUTUYA ALT SATIRLARI TANIMA ÖZELLİĞİ EKLE
    kKutusu.style.whiteSpace = "pre-line";

    kKutusu.innerHTML = `
        <div style="font-size:0.7rem; color:var(--info); font-weight:bold; margin-bottom:10px;">${asamaGosterim}</div>
        ${resimHtml}
        <div style="font-size:1.8rem; font-weight:900; color:#fff;">
            ${kelime.toUpperCase()}
            <span style="font-size:0.9rem; color:var(--info); display:block; margin-top:5px;">${yildizliEtiket}</span>
        </div>
        ${notHtml}
        <div style="display:${butonGosterim}; gap:12px; margin-top:20px; width:100%;">
            <button onclick="kelimeDegistir(-1)" class="aksiyon" style="background:rgba(255,255,255,0.05); margin:0; flex:1;">⬅️</button>
            <button onclick="kelimeDegistir(1)" class="aksiyon" style="background:rgba(255,255,255,0.05); margin:0; flex:1;">➡️</button>
        </div>`;
}
function resimDene(img, isim) { 
    if(img.src.endsWith(".jpeg")) {
        img.src = "resimler/" + isim + ".jpg"; 
    } else if(img.src.endsWith(".jpg")) {
        img.src = "resimler/" + isim + ".png"; 
    } else { 
        img.onerror = null; 
        // Resim bulunamadığında o alanı (div'i) tamamen gizle
        const parent = img.parentElement;
        if (parent && parent.id === "resimAlani") {
            parent.style.display = "none";
        } else {
            img.style.display = "none";
        }
    } 
}

function kelimeDegistir(yon) {
    let yeni = mevcutKelimeIndeksi + yon;
    if(yeni >= 0 && yeni < mevcutKelimeler.length) {
        mevcutKelimeIndeksi = yeni;
        kelimeGuncelle();
    }
}

function sayaciBaslat() {
    const btn = document.getElementById('btnBasla');
    
    if (!sayacDurduruldu) {
        if (zamanlayici) { 
            // DURAKLATMA (Pause)
            clearInterval(zamanlayici);
            zamanlayici = null;
            sayacDurduruldu = true;
            window.speechSynthesis.cancel(); 
            btn.innerText = "DEVAM ET";
            btn.style.background = "#f59e0b"; // Turuncu/Sarı (Uyarı rengi)
            return;
        }
        kalanSure = aktifVeri.s;
    }

    // BAŞLATMA VE DEVAM ETTİRME
    window.speechSynthesis.cancel();
    sayacDurduruldu = false;
    btn.innerText = "DURDUR";
    btn.style.background = "#ef4444"; // Kırmızı (Durdurma ikonu rengi)
    document.getElementById('kararGrubu').style.display = 'flex';

    zamanlayici = setInterval(() => {
        kalanSure--;
        document.getElementById('sayac').innerText = kalanSure;
        if (kalanSure <= 10 && kalanSure > 0) beepsesi();
        if (kalanSure <= 0) { 
            clearInterval(zamanlayici); 
            zamanlayici = null;
            sesliOku("Süre bitti!"); 
            btn.style.display = 'none';
        }
    }, 1000);
}


   

function kararVer(basari) {

    tumSesleriDurdur();

        const ses = aktifVeri.basariliSes || "basarili";

        oyuncular[sira].puan += odul;

    } else {

        const ses = aktifVeri.basarisizSes || "basarisiz";

        oyuncular[sira].puan -= ceza;
    }

    // ⬇️ BURASI ORTAK ALAN (if dışında!)

    document.getElementById('mGorev').style.display = 'block';

    // YENİ EKLEDİĞİMİZ UYARIYI TEMİZLEME:
    const eskiUyari = document.getElementById('teslimUyarisi');
    if(eskiUyari) eskiUyari.remove();
}

 resetPanel();

function sesleriHazirla() {
    const sesler = window.speechSynthesis.getVoices();
    // Siri'yi ara, bulamazsan Premium sesleri ara, o da yoksa herhangi bir Türkçe ses al
    siriSesi = sesler.find(s => s.lang.includes('tr') && (s.name.includes('Siri') || s.name.includes('Ses 2'))) || 
               sesler.find(s => s.lang.includes('tr') && s.name.includes('Premium')) ||
               sesler.find(s => s.lang.includes('tr'));
}
